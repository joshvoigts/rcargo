[workspace]
members = [".", "crates/rcargo-protocol", "crates/rcargo-shim"]

[package]
name = "rcargo"
description = "Run cargo on a remote host and stream output back locally"
version = "0.1.0"
edition = "2021"

[build-dependencies]
base64 = "0.22.1"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
shell-quote = "0.7.2"
toml = "1.1.2"
rcargo-protocol = { path = "crates/rcargo-protocol" }
base64 = "0.22.1"
ignore = "0.4.31"
fast_rsync = "0.2.0"
sha2 = "0.10.9"
