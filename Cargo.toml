[package]
name = "rcargo"
description = "Run cargo on a remote host and stream output back locally"
version = "0.5.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.33"
serde = { version = "1.0", features = ["derive"] }
shell-quote = "0.7.2"
toml = "1.1.2"
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3.10.1"
